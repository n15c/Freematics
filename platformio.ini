; Freematics ONE+ Telelogger (rewrite)
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = freematics_one_plus

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp-wrover-kit
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
; two OTA app slots (1.9 MB each) + LittleFS for the offline queue
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"2.0.0\"

; Freematics ONE+ Model A/B/H without PSRAM usage (works on every unit)
[env:freematics_one_plus]

; Model B/H: use the 4/8 MB PSRAM for a much larger in-memory queue
[env:freematics_one_plus_psram]
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
